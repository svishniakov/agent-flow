name: Push checks and distributions

on:
  push:

permissions:
  contents: read

jobs:
  check-and-build:
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      release-artifact: ${{ steps.release.outputs.artifact }}
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and read tool versions
        id: versions
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tools = json.loads(Path("skills/agent-flow/check-tools.json").read_text())
          versions = {
              "python": tools["python"]["tested"],
              "node": tools["node"]["tested"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in versions.items():
                  print(f"{name}={version}", file=output)
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Prepare all pinned check dependencies
        run: |
          python3 scripts/prepare-check-environment.py \
            --prefix /opt/homebrew/opt/agent-flow-checks
          echo /opt/homebrew/opt/agent-flow-checks/bin >> "$GITHUB_PATH"

      - name: Run the complete pre-commit test suite
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /opt/homebrew/opt/agent-flow-checks/bin/python3 scripts/check-all.py

      - name: Build and verify both distributions
        id: build
        run: |
          python3 scripts/build-distributions.py \
            --output "$RUNNER_TEMP/agent-flow-dist" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/build-result.json"
          python3 scripts/verify-distributions.py \
            --source "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/agent-flow-dist" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "build-result.json").read_text())
          archives = result["archives"]
          outputs = {
              "version": result["version"],
              "skill": next(path for path in archives if path.endswith("-skill.zip")),
              "plugin": next(path for path in archives if path.endswith("-codex-plugin.zip")),
              "checksums": result["checksums"],
              "metadata": result["metadata"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in outputs.items():
                  print(f"{name}={value}", file=output)
          PY

      - name: Build and verify numbered plugin release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/publish-skill-release.py --check-source-only \
            --release-tag "$RELEASE_TAG" --commit-sha "$GITHUB_SHA"
          python3 scripts/build-distributions.py \
            --output "$RUNNER_TEMP/agent-flow-release" \
            --release-tag "$RELEASE_TAG" --commit-sha "$GITHUB_SHA"
          python3 scripts/verify-distributions.py \
            --directory "$RUNNER_TEMP/agent-flow-release" \
            --release-tag "$RELEASE_TAG" --commit-sha "$GITHUB_SHA"
          echo "artifact=plugin-release-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Save verified numbered plugin bundle
        if: ${{ steps.release.outputs.artifact != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/agent-flow-release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save verified installable archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-flow-${{ steps.build.outputs.version }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ steps.build.outputs.skill }}
            ${{ steps.build.outputs.plugin }}
            ${{ steps.build.outputs.checksums }}
            ${{ steps.build.outputs.metadata }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-skill-release:
    name: Publish Codex plugin
    needs: check-and-build
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: skill-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.6"

      - name: Install pinned GitHub CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/gh.tar.gz"
          echo "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.101.0_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Download the verified plugin bundle from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.check-and-build.outputs.release-artifact }}
          path: ${{ runner.temp }}/agent-flow-release

      - name: Verify bundle and publish only the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/publish-skill-release.py \
            --directory "$RUNNER_TEMP/agent-flow-release" \
            --release-tag "$RELEASE_TAG" --commit-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY"
