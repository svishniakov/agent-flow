name: Push checks and distributions

on:
  push:

permissions:
  contents: read

jobs:
  check-and-build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: skill-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tools = json.loads(Path("skills/agent-flow/check-tools.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"python={tools['python']['tested']}", file=output)
              print(f"node={tools['node']['tested']}", file=output)
              print(f"skills={tools['cli']['skills']}", file=output)
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install the pinned Skills CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-flow-checks" --ignore-scripts \
            --no-audit --no-fund --save-exact "skills@${{ steps.versions.outputs.skills }}"
          echo "$RUNNER_TEMP/agent-flow-checks/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run the complete test suite
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 skills/agent-flow/scripts/check-all.py

      - name: Build and verify the plugin release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        run: |
          python3 scripts/build-plugin.py \
            --output "$RUNNER_TEMP/agent-flow-release" \
            --release-tag "$GITHUB_REF_NAME" --commit-sha "$GITHUB_SHA"

      - name: Publish the plugin release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-skill-release.py \
            --directory "$RUNNER_TEMP/agent-flow-release" \
            --release-tag "$GITHUB_REF_NAME" --commit-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY"
