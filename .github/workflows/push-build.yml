name: Push checks and distributions

on:
  push:

permissions:
  contents: read

jobs:
  check-and-build:
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and read tool versions
        id: versions
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tools = json.loads(Path("skills/agent-flow/check-tools.json").read_text())
          versions = {
              "python": tools["python"]["tested"],
              "node": tools["node"]["tested"],
              "codex": tools["cli"]["codex"],
              "browser": tools["browser"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in versions.items():
                  print(f"{name}={version}", file=output)
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Place pinned tools in existing sandbox tool roots
        run: |
          cp -R "$(dirname "$(dirname "$(command -v node)")")" /opt/homebrew/opt/agent-flow-node
          cp /System/Library/OpenSSL/openssl.cnf /opt/homebrew/opt/agent-flow-node/openssl.cnf
          cmp /System/Library/OpenSSL/openssl.cnf /opt/homebrew/opt/agent-flow-node/openssl.cnf
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys

          config = Path("/opt/homebrew/opt/agent-flow-node/openssl.cnf").read_text()
          if any(line.strip().startswith((".include", "module", "dynamic_path")) for line in config.splitlines()):
              raise SystemExit("OpenSSL configuration needs an explicit dependency bundle")
          launcher = Path("/opt/homebrew/bin/node")
          if launcher.is_symlink() or launcher.exists():
              launcher.unlink()
          launcher.write_text('#!/bin/sh\nexec /opt/homebrew/opt/agent-flow-node/bin/node --openssl-config=/opt/homebrew/opt/agent-flow-node/openssl.cnf "$@"\n')
          launcher.chmod(0o755)
          shutil.copytree(Path(shutil.which("go")).resolve().parents[1], "/opt/homebrew/opt/agent-flow-go", symlinks=False)
          shutil.copy2(shutil.which("bun"), "/opt/homebrew/bin/bun")
          for name, target in {
              "go": "/opt/homebrew/opt/agent-flow-go/bin/go",
          }.items():
              link = Path("/opt/homebrew/bin") / name
              if link.is_symlink() or link.exists():
                  link.unlink()
              link.symlink_to(target)
          python = Path(sys.executable).resolve()
          if not python.is_relative_to("/Library/Frameworks/Python.framework/Versions"):
              raise SystemExit(f"Python is outside the supported sandbox framework root: {python}")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print(f"AGENT_FLOW_PYTHON_BIN={python.parent}", file=output)
          PY
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/node --version
          python3 --version
          /opt/homebrew/bin/go version
          /opt/homebrew/bin/bun --version

      - name: Install Codex CLI and browser
        env:
          CODEX_VERSION: ${{ steps.versions.outputs.codex }}
          BROWSER_VERSION: ${{ steps.versions.outputs.browser }}
        run: |
          npm install --prefix /opt/homebrew/lib/agent-flow-codex --ignore-scripts \
            --no-audit --no-fund --save-exact "@openai/codex@$CODEX_VERSION"
          ln -s /opt/homebrew/lib/agent-flow-codex/node_modules/.bin/codex /opt/homebrew/bin/codex
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/$BROWSER_VERSION/mac-arm64/chrome-headless-shell-mac-arm64.zip" \
            --output "$RUNNER_TEMP/browser.zip"
          echo "302f82603be06683947594ecd60f849e362a8fe3dd82a89bd4408477c97e75a6  $RUNNER_TEMP/browser.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/browser.zip" -d "$RUNNER_TEMP/browser"
          echo "AGENT_FLOW_TEST_BROWSER=$RUNNER_TEMP/browser/chrome-headless-shell-mac-arm64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: Prepare all pinned check dependencies
        run: |
          "$AGENT_FLOW_PYTHON_BIN/python3" scripts/prepare-check-environment.py \
            --prefix /opt/homebrew/opt/agent-flow-checks \
            --browser "$AGENT_FLOW_TEST_BROWSER"
          ln -s /opt/homebrew/opt/agent-flow-checks/bin/pnpm /opt/homebrew/bin/pnpm
          echo /opt/homebrew/opt/agent-flow-checks/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo "$AGENT_FLOW_PYTHON_BIN" >> "$GITHUB_PATH"

      - name: Run the complete pre-commit test suite
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /opt/homebrew/opt/agent-flow-checks/bin/python3 scripts/check-all.py

      - name: Build and verify both distributions
        id: build
        run: |
          python3 scripts/build-distributions.py \
            --output "$RUNNER_TEMP/agent-flow-dist" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/build-result.json"
          python3 - <<'PY'
          import os
          from pathlib import Path

          archive = next((Path(os.environ["RUNNER_TEMP"]) / "agent-flow-dist").glob("*-skill.zip"))
          archive.write_bytes(archive.read_bytes() + b"intentional C2 package verification failure")
          PY
          python3 scripts/verify-distributions.py \
            --source "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/agent-flow-dist" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "build-result.json").read_text())
          archives = result["archives"]
          outputs = {
              "version": result["version"],
              "skill": next(path for path in archives if path.endswith("-skill.zip")),
              "plugin": next(path for path in archives if path.endswith("-codex-plugin.zip")),
              "checksums": result["checksums"],
              "metadata": result["metadata"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in outputs.items():
                  print(f"{name}={value}", file=output)
          PY

      - name: Save verified installable archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-flow-${{ steps.build.outputs.version }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ steps.build.outputs.skill }}
            ${{ steps.build.outputs.plugin }}
            ${{ steps.build.outputs.checksums }}
            ${{ steps.build.outputs.metadata }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
